[project]
name = "carry-context"
version = "0.1.0"
description = "Everything your phone knows, on your agent's desk. Mac daemon, CLI and MCP server for Carry."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "Tao Fangbo" }]
dependencies = [
  "typer>=0.15",
  "rich>=13",
  "mcp>=2",
  "cryptography>=43",
]

[project.optional-dependencies]
pro = ["ocrmac>=1.0", "mlx-whisper>=0.4"]

[project.scripts]
carry = "carry.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/carry"]
