# Carry for iOS. Generate the Xcode project with `xcodegen generate`.
name: Carry
options:
  bundleIdPrefix: app.carry
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "26.2"
  createIntermediateGroups: true
  groupSortPosition: top
  generateEmptyDirectories: false

settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    DEVELOPMENT_TEAM: PZHSCK4VXU
    # Signing is parameterised so the open-source project stays team-neutral.
    # Release builds for TestFlight pass CARRY_SIGN_STYLE=Manual plus the two profile names on the command line.
    CARRY_SIGN_STYLE: Automatic
    CARRY_PROFILE_APP: ""
    CARRY_PROFILE_SHARE: ""
    CODE_SIGN_STYLE: "$(CARRY_SIGN_STYLE)"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1"
    SUPPORTED_PLATFORMS: "iphoneos iphonesimulator"
    SUPPORTS_MACCATALYST: NO
    GENERATE_INFOPLIST_FILE: NO
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_EMIT_LOC_STRINGS: NO
  configs:
    Debug:
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
      SWIFT_OPTIMIZATION_LEVEL: "-Onone"
    Release:
      SWIFT_COMPILATION_MODE: wholemodule

targets:
  Carry:
    type: application
    platform: iOS
    sources:
      - path: Carry
      - path: CarryKit
      - path: Carry.storekit
        buildPhase: none
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.carry.ios
        INFOPLIST_FILE: Carry/Info.plist
        CODE_SIGN_ENTITLEMENTS: Carry/Carry.entitlements
        PROVISIONING_PROFILE_SPECIFIER: "$(CARRY_PROFILE_APP)"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    dependencies:
      - target: CarryShare
        embed: true

  CarryShare:
    type: app-extension
    platform: iOS
    sources:
      - path: CarryShare
      # CarryKit/Capture (HealthKit, CoreLocation) is app-only; extensions cannot use HealthKit.
      - path: CarryKit
        excludes:
          - "Capture/**"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.carry.ios.share
        INFOPLIST_FILE: CarryShare/Info.plist
        CODE_SIGN_ENTITLEMENTS: CarryShare/CarryShare.entitlements
        PROVISIONING_PROFILE_SPECIFIER: "$(CARRY_PROFILE_SHARE)"
        APPLICATION_EXTENSION_API_ONLY: YES

schemes:
  Carry:
    build:
      targets:
        Carry: all
    run:
      config: Debug
      storeKitConfiguration: Carry.storekit
      # DEBUG-only: jump straight to one screen with demo data. Enable one to screenshot it.
      commandLineArguments:
        "-carryScreen welcome": false
        "-carryScreen sources": false
        "-carryScreen home": false
        "-carryScreen pro": false
        "-carryScreen settings": false
        "-carryICloudOff 1": false
        "-carryScroll bottom": false
    archive:
      config: Release
